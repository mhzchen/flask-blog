name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff 代码规范检查
        run: ruff check app tests scripts wsgi.py config.py seed.py celery_worker.py
      - name: mypy 类型检查（核心纯逻辑模块）
        run: mypy app/sanitize.py app/services.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        run: pytest

  migration:
    name: DB Migration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: flask_blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 干净 MySQL 库执行迁移建全表（flask db upgrade 0001->0007）
        run: |
          export FLASK_APP=wsgi.py
          export DATABASE_URL="mysql+pymysql://root:root@127.0.0.1:3306/flask_blog?charset=utf8mb4"
          flask db upgrade
      - name: 校验迁移建出的表与模型元数据一致
        run: |
          export DATABASE_URL="mysql+pymysql://root:root@127.0.0.1:3306/flask_blog?charset=utf8mb4"
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, inspect
          from app import create_app
          from app.models import db
          engine = create_engine(os.environ['DATABASE_URL'])
          tables = set(inspect(engine).get_table_names())
          expect = {'alembic_version', 'categories', 'comments', 'favorites',
                    'post_likes', 'post_tags', 'posts', 'tags', 'users'}
          missing = expect - tables
          assert not missing, f'迁移缺失表: {missing}'
          # 模型元数据里的表应都能在迁移后的库里找到（防模型/迁移漂移）
          with create_app('development').app_context():
              model_tables = set(db.metadata.tables.keys())
          drift = model_tables - tables
          assert not drift, f'模型有但迁移未建的表: {drift}'
          print('迁移建表完整，模型无漂移，表数:', len(tables))
          EOF

  frontend:
    name: Frontend (Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (legacy-peer-deps 兼容 vite5/vitest)
        run: npm ci --legacy-peer-deps
      - name: Vitest 单元/组件测试
        run: npm run test
      - name: 生产构建验证（vite build）
        run: npm run build
