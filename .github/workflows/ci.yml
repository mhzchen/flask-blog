name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff 代码规范检查
        run: ruff check app tests scripts wsgi.py config.py seed.py celery_worker.py
      - name: mypy 类型检查（核心纯逻辑模块）
        run: mypy app/sanitize.py app/services.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests with coverage gate
        run: pytest

  frontend:
    name: Frontend (Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (legacy-peer-deps 兼容 vite5/vitest)
        run: npm ci --legacy-peer-deps
      - name: Vitest 单元/组件测试
        run: npm run test
      - name: 生产构建验证（vite build）
        run: npm run build
