# mypy 类型检查配置（对应知识域⑥：类型提示）
# 运行：mypy app/sanitize.py
# 说明：Flask/SQLAlchemy 深度集成的模块（models/api）因动态注册的类型推断
#       易产生误报且维护成本高；先对纯逻辑模块做严格类型检查作为门槛，
#       集成模块按文件级 ignore_errors 处理，后续逐步收窄。
[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
no_implicit_optional = True
show_error_codes = True
ignore_missing_imports = True

[mypy-bleach.*]
ignore_missing_imports = True

# Flask/SQLAlchemy 深度集成的模块：已知误报，文件级忽略
[mypy-app.models]
ignore_errors = True

[mypy-app.api.*]
ignore_errors = True

[mypy-app.schemas]
ignore_errors = True

[mypy-app.errors]
ignore_errors = True

[mypy-app.celery_app]
ignore_errors = True

[mypy-app.tasks]
ignore_errors = True

[mypy-app.cache]
ignore_errors = True

[mypy-app.openapi]
ignore_errors = True
