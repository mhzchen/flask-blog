services:
  db:
    image: mysql:8.0
    container_name: flaskblog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flask_blog
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3307:3306"
    # 把容器内 MySQL 的 3306 映射到宿主机 3307，便于用 Navicat/Workbench 等图形工具连接：
    #   连接地址 localhost:3307，账号 root / root，数据库 flask_blog
    # 用 3307 而非 3306，避免与本机将来可能安装的 MySQL 冲突

  redis:
    image: redis:7-alpine
    container_name: flaskblog-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 缓存 db0，Celery broker/backend 用 db1

  meilisearch:
    image: getmeili/meilisearch:v1.13.4
    container_name: flaskblog-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey123}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"

  backend:
    build: .
    container_name: flaskblog-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/flask_blog?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: production
      # GitHub OAuth 登录（#60）：未配置时 OAuth 端点 503 降级，不影响密码登录
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: http://localhost:5000/api/v1/auth/github/callback
      CORS_ORIGINS: http://localhost:8080
      CACHE_ENABLED: "true"
      CACHE_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey123}
      SOCKETIO_MESSAGE_QUEUE: redis://redis:6379/3
      LOG_FILE_ENABLED: "true"
      LOG_DIR: /app/logs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./logs:/app/logs
    ports:
      - "8000:8000"

  worker:
    build: .
    container_name: flaskblog-worker
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info -Q critical,default
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/flask_blog?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: production
      CACHE_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey123}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-critical:
    build: .
    container_name: flaskblog-worker-critical
    restart: unless-stopped
    # 只消费 critical 队列，独占处理维护类/关键任务（预热、死信清理），
    # 与 default 队列隔离，保证关键任务不被普通业务任务挤占（优先级隔离）。
    command: celery -A celery_worker.celery worker --loglevel=info -Q critical --concurrency=2
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/flask_blog?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: production
      CACHE_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey123}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: flaskblog-beat
    restart: unless-stopped
    command: celery -A celery_worker.celery beat --loglevel=info
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/flask_blog?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FLASK_ENV: production
      CACHE_REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/2
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-devMasterKey123}
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: flaskblog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: flaskblog-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: flaskblog-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: flaskblog-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
      # trace 落盘目录：collector 把 span 写到 /tmp/traces.json，即宿主 monitoring/traces
      - ./monitoring/traces:/tmp
    ports:
      - "4318:4318"


volumes:
  db_data:
  redis_data:
  meili_data:
  grafana_data: