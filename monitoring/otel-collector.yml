receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: basic
  # trace 同时落盘到 /tmp/traces.json（宿主机 monitoring/traces），供离线瀑布查看器 trace-viewer.html 读取；
  # 网络恢复并接入 Jaeger/Tempo 时，把 jaeger/tempo exporter 加入 exporters 并在 pipelines 引用即可。
  file:
    path: /tmp/traces.json
    flush_interval: 1

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, file]