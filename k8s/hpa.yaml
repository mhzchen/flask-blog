# K8s 水平自动扩缩（HPA）预演清单
# 说明：当前项目以 docker compose 部署；本文件为迁往 K8s 时的扩缩配置预演，
#       需集群启用 metrics-server 后生效（kubectl apply -f k8s/hpa.yaml）。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flask-blog-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flask-blog-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300