# Redis Sentinel 高可用配置（模板）——供生产多机部署参考
#
# 架构：3 个 Redis 节点（1 主 2 从）+ 3 个 Sentinel 组成高可用集群。
# Sentinel 监控主库（monitor），主库不可用（down-after 超时）时，多数派哨兵
# 协商自动把某从库提升为新主，并让其他从库跟随新主（自动故障转移）。
#
# 单机 docker compose 不启用本模板：同机多容器无真实故障隔离价值；
# 生产请在 3 台独立主机上分别部署 Redis 主从 + Sentinel，并配置密码。
sentinel monitor flaskblog-master 127.0.0.1 6379 2
sentinel down-after-milliseconds flaskblog-master 5000
sentinel failover-timeout flaskblog-master 10000
sentinel parallel-syncs flaskblog-master 1